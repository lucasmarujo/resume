name: Resume

on:
  push:
    branches: [master]
    paths:
      - 'resume-ptbr.tex'
      - 'resume-en.tex'
      - 'preamble.tex'
      - '.github/workflows/resume.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Valida o tradutor
        run: python scripts/translate.py --selftest

      - name: Compila os PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            resume-ptbr.tex
            resume-en.tex

      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume-*.pdf

      - name: Publica a release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest resume-ptbr.pdf resume-en.pdf \
            --title "Curriculo / Resume" \
            --notes "Gerado automaticamente a partir de resume-ptbr.tex - commit ${GITHUB_SHA::7}"
